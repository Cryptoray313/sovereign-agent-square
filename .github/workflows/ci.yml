name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install toolchain (mops + icp-cli + ic-wasm)
        run: npm install -g ic-mops@2.20.0 @icp-sdk/icp-cli @icp-sdk/ic-wasm
      - name: Install dependencies + pinned Motoko toolchain
        run: mops install --lock check
      - name: Typecheck + lint
        run: mops check
      - name: Tests (property + PocketIC integration)
        run: mops test
      - name: Build all canisters (icp build)
        run: icp build
      - name: Forbidden-reference grep (handoff §2 / L8)
        env:
          FORBIDDEN_TOKENS: ${{ secrets.FORBIDDEN_TOKENS }}
        run: ./scripts/forbidden-grep.sh
      - name: Core write-path separation check (handoff §4)
        run: ./scripts/core-write-path-check.sh
