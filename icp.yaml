# Sovereign Agent Square — icp-cli project config.
#
# test_ledger is deliberately ABSENT from this file: it exists only for mops
# replica tests (tests/*.test.mo instantiate it directly on PocketIC) and must
# never be deployable to any network (handoff L8 discipline).
#
# Canister-level init_args hold MAINNET-SAFE values; the local environment
# overrides what differs (see environments below). Nothing deploys to the ic
# environment without EZ's explicit approval (docs/DEPLOY_RUNBOOK.md).

canisters:
  - name: constitution
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: square_escrow
    recipe:
      type: "@dfinity/motoko@v5.0.0"
    # Real ICP ledger; 1 ICP operational cap (Phase 2, L26); min deadline 1h;
    # review window 72h (EZ-confirmed 2026-08-06).
    init_args: >-
      (record {
        ledgerId = principal "ryjl3-tyaaa-aaaaa-aaaba-cai";
        opCapE8s = 100_000_000 : nat;
        minDeadlineNs = 3_600_000_000_000 : nat;
        reviewWindowNs = 259_200_000_000_000 : nat;
      })

  - name: square_core
    recipe:
      type: "@dfinity/motoko@v5.0.0"
    # escrowId is environment-specific and generated by the deploy flow:
    # scripts/deploy-local.sh (local) / docs/DEPLOY_RUNBOOK.md (ic).
    init_args:
      path: deploy/local/square_core.args
      format: candid

  - name: frontend_assets
    recipe:
      type: "@dfinity/static-site@v0.3.3"
      configuration:
        dir: canisters/frontend_assets/dist
        build:
          - cd canisters/frontend_assets && npm install --no-audit --no-fund && node build.mjs

environments:
  - name: local
    network: local
    canisters: [constitution, square_escrow, square_core, frontend_assets]
    init_args:
      square_escrow: >-
        (record {
          ledgerId = principal "ryjl3-tyaaa-aaaaa-aaaba-cai";
          opCapE8s = 100_000_000 : nat;
          minDeadlineNs = 60_000_000_000 : nat;
          reviewWindowNs = 259_200_000_000_000 : nat;
        })

  - name: mainnet
    network: ic
    canisters: [constitution, square_escrow, square_core, frontend_assets]
    settings:
      square_escrow:
        freezing_threshold: 90d
      square_core:
        freezing_threshold: 90d
      frontend_assets:
        freezing_threshold: 90d
      constitution:
        freezing_threshold: 90d
    init_args:
      square_core:
        path: deploy/ic/square_core.args
        format: candid
